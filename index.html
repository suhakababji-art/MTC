<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">

<!-- FORCE DESKTOP MODE ALWAYS -->
<meta name="viewport" content="width=1200">

<title>MovieTalk Club</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --dark-green: #004d40;
    --beige-bg: #e8e6d9;
    --text-color: #2c2c2c;
    --accent-blue: #a0d2eb;
}
body {
    background-color: var(--beige-bg);
    color: var(--text-color);
    font-family: 'Cairo', sans-serif;
    margin: 0;
}
nav {
    background-color: var(--dark-green);
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
}
.nav-brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    cursor: pointer;
}
.nav-links button {
    background: none;
    border: none;
    color: white;
    font-size: 1.1rem;
    margin-right: 20px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
}
.hero {
    text-align: center;
    padding: 80px 20px;
    background-color: #f4f3ed;
}
.hero h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 4rem;
    color: var(--dark-green);
    margin-bottom: 0;
}
.hero p {
    font-size: 1.5rem;
    font-family: 'Playfair Display', serif;
    margin-top: 10px;
}
.section-title {
    padding: 20px 50px;
    font-size: 1.8rem;
    border-right: 8px solid #00796b;
    margin: 40px 50px;
}
.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
}
.movie-card {
    display: flex;
    background: #fffdf9;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin-bottom: 30px;
    position: relative;
}
.movie-poster {
    background-color: #6d5d6e;
    color: white;
    width: 30%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
}
.movie-info {
    width: 70%;
    padding: 30px;
}
.meta-data {
    display: flex;
    gap: 20px;
    color: #777;
    font-size: 0.9rem;
    margin-bottom: 15px;
}
.description {
    font-size: 1.1rem;
    line-height: 1.8;
}
.delete-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ff5252;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    display: none;
}
.admin-controls { display:none; }

section { display:none; }
section.active { display:block; }

.vote-card {
    display: flex;
    justify-content: space-between;
    background: #fffdf9;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}
.vote-btn {
    background: var(--accent-blue);
    border: none;
    padding: 8px 20px;
    border-radius: 10px;
    cursor: pointer;
}

.analyzer-box {
    background: white;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
}

input, textarea {
    width: 80%;
    padding: 15px;
    border-radius: 25px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
}

.btn-main {
    background: var(--dark-green);
    color: white;
    padding: 12px 40px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}
</style>
</head>

<body>

<nav>
    <div class="nav-brand" id="admin-trigger">MovieTalk</div>
    <div class="nav-links">
        <button onclick="showSection('home')">Home</button>
        <button onclick="showSection('analyzer')">Smart Analyzer ✨</button>
        <button onclick="showSection('voting')">Voting</button>
        <button onclick="showSection('admins')">Admins</button>
    </div>
</nav>

<section id="home" class="active">
    <div class="hero">
        <h2>Watch. Discuss. Learn.</h2>
        <p>Welcome at MovieTalk Club</p>
    </div>

    <h2 class="section-title">Upcoming Screenings</h2>
    <div class="container" id="screenings-list">
        <div class="movie-card" data-title="Dead Poets Society">
            <button class="delete-btn">Delete</button>
            <div class="movie-poster">Dead Poets Society</div>
            <div class="movie-info">
                <div class="meta-data">
                    <span>📅 Nov 15</span>
                    <span>⏰ 12:00 PM</span>
                    <span>📍 Hall B</span>
                </div>
                <div class="description">
                    Join us for an open discussion about literary themes.
                </div>
            </div>
        </div>
    </div>

    <div class="admin-controls">
        <button id="add-screening-btn">Add Screening</button>
    </div>
</section>

<section id="analyzer">
    <div class="container">
        <div class="analyzer-box">
            <h2>Smart Analyzer</h2>
            <input type="text" id="movie-input" placeholder="Movie title">
            <button class="btn-main" onclick="analyzeMovie()">Analyze</button>
            <div id="result"></div>

            <!-- ADMIN ONLY -->
            <div id="admin-analyzer" style="display:none;margin-top:30px;">
                <h3>Add Movie (Admin)</h3>
                <input id="admin-title" placeholder="Movie title">
                <textarea id="admin-desc" placeholder="Analysis"></textarea>
                <button class="btn-main" onclick="addMovie()">Add</button>
            </div>
        </div>
    </div>
</section>

<section id="voting">
    <h2 class="section-title">Voting</h2>
    <div class="container" id="voting-list"></div>
</section>

<section id="admins">
    <h2 class="section-title">Admins</h2>
    <div class="container">
        <strong>Suha Kababji</strong><br>Club Coordinator
    </div>
</section>

<script>
function showSection(id){
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

let db = {
    "inception":"A skilled thief enters dreams to plant ideas.",
    "joker":"A man ignored by society descends into madness."
};

function analyzeMovie(){
    let t = movieInput.value.toLowerCase();
    result.innerHTML = db[t] || "This movie will be added soon.";
}

function addMovie(){
    let t = adminTitle.value.toLowerCase();
    let d = adminDesc.value;
    if(t && d){
        db[t]=d;
        alert("Added!");
        adminTitle.value="";
        adminDesc.value="";
    }
}

let clicks=0;
admin-trigger.onclick=()=>{
    clicks++;
    if(clicks===5){
        let p=prompt("Password");
        if(p==="mtc.english"){
            document.querySelectorAll('.delete-btn,.admin-controls').forEach(e=>e.style.display="block");
            admin-analyzer.style.display="block";
            alert("Admin mode ON");
        }
        clicks=0;
    }
};

document.querySelectorAll('.delete-btn').forEach(b=>{
    b.onclick=()=>{
        if(confirm("Delete this screening?")){
            let card=b.parentElement;
            let title=card.dataset.title;
            card.remove();
            document.querySelectorAll('.vote-card').forEach(v=>{
                if(v.innerText.includes(title)) v.remove();
            });
        }
    }
});
</script>

</body>
</html>
