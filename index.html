<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">

<!-- Desktop Site Mode ONLY -->
<meta name="viewport" content="width=1200, user-scalable=no">

<title>MovieTalk Club</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --dark-green: #004d40;
    --beige-bg: #e8e6d9;
    --text-color: #2c2c2c;
    --accent-blue: #a0d2eb;
}
body {
    background-color: var(--beige-bg);
    color: var(--text-color);
    font-family: 'Cairo', sans-serif;
    margin: 0;
}
nav {
    background-color: var(--dark-green);
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
}
.nav-brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    cursor: pointer;
}
.nav-links button {
    background: none;
    border: none;
    color: white;
    font-size: 1.1rem;
    margin-right: 20px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
}
.hero {
    text-align: center;
    padding: 80px 20px;
    background-color: #f4f3ed;
}
.hero h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 4rem;
    color: var(--dark-green);
    margin-bottom: 0;
}
.hero p {
    font-size: 1.5rem;
    font-family: 'Playfair Display', serif;
    margin-top: 10px;
}
.section-title {
    padding: 20px 50px;
    font-size: 1.8rem;
    border-right: 8px solid #00796b;
    margin: 40px 50px;
}
.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
}
.movie-card {
    display: flex;
    background: #fffdf9;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin-bottom: 30px;
    position: relative;
}
.movie-poster {
    background-color: #6d5d6e;
    color: white;
    width: 30%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
}
.movie-info {
    width: 70%;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.meta-data {
    display: flex;
    gap: 20px;
    color: #777;
    font-size: 0.9rem;
    margin-bottom: 15px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}
.description {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #444;
}
.admin-controls {
    display: none;
    margin: 20px 50px;
}
.delete-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ff5252;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    display: none;
}
.analyzer-box {
    background: white;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
}
input {
    width: 80%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 30px;
    margin-bottom: 20px;
    outline: none;
}
.btn-main {
    background: var(--dark-green);
    color: white;
    padding: 12px 40px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1.1rem;
}
section { display: none; }
section.active { display: block; }
.vote-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fffdf9;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}
.vote-btn {
    background: var(--accent-blue);
    border: none;
    padding: 8px 20px;
    border-radius: 10px;
    cursor: pointer;
}
.admins-section { padding: 20px; }
.admin-card {
    background: linear-gradient(145deg, #f9f4e6, #f0e5c2);
    border-radius: 20px;
    padding: 25px 20px;
    max-width: 300px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    color: #2c2c2c;
    font-family: 'Cairo', sans-serif;
    margin-top: 20px;
}
.admin-card h3 {
    margin: 0;
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: #b38f00;
}
.admin-card p { margin: 5px 0; }
</style>
</head>
<body>
<!-- باقي الكود كما هو بدون أي تغيير -->
</body>
</html>
