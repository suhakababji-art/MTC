<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTalk Club | English Dept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // التحقق من وجود الإعدادات لتجنب خطأ 400
        const configRaw = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        const firebaseConfig = JSON.parse(configRaw);
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mtc-v1';

        onAuthStateChanged(auth, (user) => {
            if (user) {
                startApp();
            } else {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    signInAnonymously(auth);
                }
            }
        });

        function startApp() {
            // الاستماع للعروض
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'shows'), (snap) => {
                const shows = [];
                snap.forEach(d => shows.push({id: d.id, ...d.data()}));
                renderShows(shows);
            });

            // الاستماع للتصويت
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'polls'), (snap) => {
                const polls = [];
                snap.forEach(d => polls.push({id: d.id, ...d.data()}));
                renderPolls(polls);
            });
        }

        function renderShows(shows) {
            const list = document.getElementById('list');
            const adminList = document.getElementById('admin-list');
            if (shows.length === 0) {
                list.innerHTML = `<p class="text-center opacity-40 py-10">لا توجد عروض منشورة</p>`;
                adminList.innerHTML = "";
                return;
            }
            list.innerHTML = shows.map(s => `
                <div class="bg-white p-6 rounded-3xl border-2 mb-4 shadow-sm">
                    <h4 class="text-xl font-bold teal-text mb-2">${s.title}</h4>
                    <div class="text-xs text-stone-500 mb-2 font-bold uppercase">📅 ${s.date} | 🕒 ${s.time} | 📍 ${s.room}</div>
                    <p class="text-sm text-stone-700">${s.desc}</p>
                </div>
            `).join('');

            adminList.innerHTML = shows.map(s => `
                <div class="flex justify-between p-2 border-b text-sm">
                    <span>${s.title}</span>
                    <button onclick="deleteShow('${s.id}')" class="text-red-500">حذف</button>
                </div>
            `).join('');
        }

        function renderPolls(polls) {
            const pollDiv = document.getElementById('poll-div');
            const voted = localStorage.getItem('voted_' + appId);
            if (polls.length === 0) {
                pollDiv.innerHTML = `<p class="opacity-40 text-sm italic">التصويت مغلق</p>`;
                return;
            }
            const total = polls.reduce((a, b) => a + (b.votes || 0), 0);
            pollDiv.innerHTML = polls.map(p => {
                const perc = total > 0 ? Math.round((p.votes/total)*100) : 0;
                return `
                <div class="bg-stone-50 p-4 rounded-2xl border mb-3">
                    <div class="flex justify-between text-sm font-bold mb-1"><span>${p.movieName}</span><span>${perc}%</span></div>
                    <div class="w-full bg-stone-200 h-2 rounded-full overflow-hidden mb-3">
                        <div class="bg-teal-600 h-full" style="width:${perc}%"></div>
                    </div>
                    ${!voted ? `<button onclick="vote('${p.id}')" class="w-full py-1 border border-teal-600 teal-text rounded-lg text-xs font-bold">تصويت</button>` : ''}
                </div>`;
            }).join('');
        }

        // Action Functions
        window.deleteShow = async (id) => {
            if(confirm("حذف؟")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', id));
        };

        window.vote = async (id) => {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'polls', id), { votes: increment(1) });
            localStorage.setItem('voted_' + appId, 'true');
        };

        window.saveShow = async () => {
            const data = {
                title: document.getElementById('t1').value,
                date: document.getElementById('t2').value,
                time: document.getElementById('t3').value,
                room: document.getElementById('t4').value,
                desc: document.getElementById('t5').value,
                createdAt: Date.now()
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'shows'), data);
            alert("تم النشر");
        };

        window.addP = async () => {
            const name = document.getElementById('pn').value;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'polls'), { movieName: name, votes: 0 });
            document.getElementById('pn').value = "";
        };

        window.resetP = async () => {
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'polls'));
            snap.forEach(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'polls', d.id)));
        };

        window.showTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        };

        window.checkLogin = () => {
            if(document.getElementById('pw').value === 'mtc.english') {
                document.getElementById('admin-pnl').classList.remove('hidden');
                document.getElementById('lgn').classList.add('hidden');
            }
        };

        let clks = 0;
        window.footerClk = () => { if(++clks >= 5) { clks=0; document.getElementById('lgn').classList.toggle('hidden'); }};

        // ميزة Gemini البسيطة (تحليل الفيلم)
        window.aiAnalyze = async () => {
            const m = document.getElementById('ai-in').value;
            const res = document.getElementById('ai-res');
            res.innerHTML = "جاري التحليل...";
            try {
                const apiKey = ""; // سيتم تعبئته تلقائياً
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Analyze movie "${m}" for English learners.` }] }] })
                });
                const d = await response.json();
                res.innerHTML = d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            } catch (e) { res.innerHTML = "خطأ في الاتصال"; }
        };
    </script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background: #FDFCF0; }
        .teal-bg { background: #008080; }
        .teal-text { color: #008080; }
    </style>
</head>
<body class="pb-20">

    <nav class="teal-bg text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <span class="font-black italic">MovieTalk</span>
        <div class="flex gap-3 text-[10px] font-bold">
            <button onclick="showTab('pg1')">الرئيسية</button>
            <button onclick="showTab('pg2')">المحلل</button>
            <button onclick="showTab('pg3')">التصويت</button>
            <button onclick="showTab('pg4')">المسؤولين</button>
        </div>
    </nav>

    <main class="p-6 max-w-2xl mx-auto">
        
        <div id="pg1" class="tab-content">
            <h2 class="text-xl font-black mb-6">العروض القادمة</h2>
            <div id="list"></div>
        </div>

        <div id="pg2" class="tab-content hidden text-center">
            <div class="bg-white p-8 rounded-3xl shadow-sm border">
                <h2 class="text-xl font-black mb-4">🤖 المحلل الذكي</h2>
                <input id="ai-in" type="text" placeholder="اسم الفيلم بالإنجليزية" class="w-full p-3 border rounded-xl mb-3 text-center">
                <button onclick="aiAnalyze()" class="teal-bg text-white w-full py-3 rounded-xl font-bold">تحليل ✨</button>
                <div id="ai-res" class="mt-6 text-left text-xs bg-stone-50 p-4 rounded-xl hidden" dir="ltr"></div>
            </div>
        </div>

        <div id="pg3" class="tab-content hidden text-center">
            <div class="bg-white p-8 rounded-3xl shadow-sm border">
                <h2 class="text-xl font-black mb-4">🗳️ التصويت</h2>
                <div id="poll-div"></div>
            </div>
        </div>

        <div id="pg4" class="tab-content hidden text-center pt-10">
            <div class="bg-white p-6 rounded-3xl border-2 border-teal-800 inline-block shadow-md">
                <div class="text-lg font-black">Suha Kababji</div>
                <div class="text-xs text-stone-400 mb-4 italic uppercase tracking-widest">Coordinator</div>
                <div class="bg-stone-50 p-3 rounded-xl border border-dashed font-black teal-text tracking-tighter">0593259597</div>
            </div>
        </div>

        <!-- Admin Section -->
        <div id="lgn" class="hidden mt-10 p-4 bg-white border rounded-2xl text-center">
            <input id="pw" type="password" placeholder="Pass" class="p-2 border rounded mr-2">
            <button onclick="checkLogin()" class="teal-bg text-white px-4 py-2 rounded">دخول</button>
        </div>

        <div id="admin-pnl" class="hidden mt-10 bg-white p-6 rounded-3xl border-2 border-teal-600">
            <h3 class="font-bold mb-4">إضافة عرض:</h3>
            <input id="t1" type="text" placeholder="العنوان" class="w-full p-2 border rounded mb-2 text-sm">
            <div class="grid grid-cols-3 gap-1 mb-2">
                <input id="t2" type="text" placeholder="التاريخ" class="p-2 border rounded text-xs">
                <input id="t3" type="text" placeholder="الوقت" class="p-2 border rounded text-xs">
                <input id="t4" type="text" placeholder="القاعة" class="p-2 border rounded text-xs">
            </div>
            <textarea id="t5" placeholder="الوصف" class="w-full p-2 border rounded mb-2 text-xs"></textarea>
            <button onclick="saveShow()" class="teal-bg text-white w-full py-2 rounded font-bold mb-6">نشر</button>
            
            <div class="border-t pt-4">
                <h3 class="font-bold mb-2">حذف العروض:</h3>
                <div id="admin-list" class="mb-6"></div>
                <h3 class="font-bold mb-2">التصويت:</h3>
                <input id="pn" type="text" placeholder="فيلم جديد" class="p-2 border rounded w-full mb-2">
                <button onclick="addP()" class="bg-amber-500 text-white w-full py-2 rounded font-bold">إضافة خيار</button>
                <button onclick="resetP()" class="text-red-500 text-[10px] underline block mt-2">تصفير الكل</button>
            </div>
        </div>

    </main>

    <footer onclick="footerClk()" class="py-10 text-center opacity-20 text-[10px] uppercase font-black tracking-widest">
        MovieTalk Club | English Dept
    </footer>

</body>
    </html>
